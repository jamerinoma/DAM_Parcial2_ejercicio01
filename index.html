<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' https://rickandmortyapi.com data:; connect-src https://rickandmortyapi.com; object-src 'none'"
    />
    <title>Rick and Morty</title>
    <link rel="icon" href="assets/icon.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="encabezado">
      <div class="contenedor">
        <p class="etiqueta">Catálogo de personajes</p>
        <h1>Rick and Morty</h1>
        <p>Personajes de la serie consultados desde la API pública.</p>
        <p>Desarrollado por Jaime Merino.</p>
      </div>
    </header>

    <main class="contenedor">
      <div class="barra">
        <h2>Personajes</h2>
        <span id="total">Consultando información...</span>
      </div>

      <p id="loading" class="mensaje" role="status">Cargando personajes...</p>
      <p id="error" class="mensaje error" role="alert" hidden></p>

      <div id="card-dinamica" class="tarjetas"></div>

      <template id="template-card">
        <article class="tarjeta">
          <img class="foto" alt="" loading="lazy" />
          <div class="detalle">
            <h3 class="nombre"></h3>
            <p class="estado"></p>
            <dl>
              <div>
                <dt>Especie</dt>
                <dd class="especie"></dd>
              </div>
              <div>
                <dt>Género</dt>
                <dd class="genero"></dd>
              </div>
              <div>
                <dt>Origen</dt>
                <dd class="origen"></dd>
              </div>
            </dl>
          </div>
        </article>
      </template>

      <nav class="paginacion" aria-label="Navegación de personajes">
        <button id="anterior" type="button" disabled>Anterior</button>
        <span id="pagina">Página 1</span>
        <button id="siguiente" type="button" disabled>Siguiente</button>
      </nav>
    </main>
    <script src="renderer.js"></script>
  </body>
</html>
